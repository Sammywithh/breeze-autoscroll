name: Build & Package Breeze Autoscroll (Rust)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Rust code
        run: cargo fmt --all

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        run: RUSTFLAGS="-D warnings" cargo test --verbose

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build Debian (.deb) package
        run: |
          chmod +x build_deb.sh install.sh uninstall.sh test_autoscroll.sh
          ./build_deb.sh

      - name: Package Linux distribution archive
        run: |
          mkdir -p dist/breeze-autoscroll artifacts
          cp target/release/breeze-autoscroll ./breeze-autoscroll
          chmod +x ./breeze-autoscroll

          cp target/release/breeze-autoscroll dist/breeze-autoscroll/
          cp install.sh uninstall.sh test_autoscroll.sh breeze-autoscroll.desktop breeze-autoscroll.service README.md dist/breeze-autoscroll/
          cp -r udev dist/breeze-autoscroll/
          chmod +x dist/breeze-autoscroll/breeze-autoscroll \
            dist/breeze-autoscroll/install.sh \
            dist/breeze-autoscroll/uninstall.sh \
            dist/breeze-autoscroll/test_autoscroll.sh

          tar -C dist -czf artifacts/breeze-autoscroll-linux-x86_64.tar.gz breeze-autoscroll
          cp target/release/breeze-autoscroll artifacts/breeze-autoscroll-linux-x86_64
          cp breeze-autoscroll_*.deb artifacts/
          (
            cd artifacts
            sha256sum * > SHA256SUMS.txt
          )

      - name: Commit and push compiled files back to repository
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add breeze-autoscroll breeze-autoscroll_*.deb src/ Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(build): update compiled Linux binary and deb package [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Compiled binary, .deb package, and sources are already up to date."
          fi

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: breeze-autoscroll-linux-x86_64
          path: artifacts/
          if-no-files-found: error

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
