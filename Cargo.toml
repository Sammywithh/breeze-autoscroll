[package]
name = "breeze-autoscroll"
version = "2.3.0"
edition = "2024"
rust-version = "1.95"
description = "Windows-style middle-click autoscroll for Kubuntu 26.04 (KDE Plasma 6) with 3D/CAD orbit protection"
license = "GPL-3.0-or-later"

[[bin]]
name = "breeze-autoscroll"
path = "src/main.rs"

[features]
default = []
debug-dbus = []

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x11rb = { version = "0.13.2", features = ["shape", "xfixes"] }
zbus = { version = "6.3.0", default-features = false, features = ["default-rt", "service", "proxy"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
overflow-checks = true
